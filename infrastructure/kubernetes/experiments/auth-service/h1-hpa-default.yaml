# H1: HPA Default — auth-service
# CPU-based HPA with default Kubernetes behavior policy
# targetCPU: 80% = the Kubernetes default target (used when an HPA sets no metric),
# no behavior field (uses K8s defaults) -> H1 is HPA with Kubernetes defaults throughout.
# Changed from 70% on 2026-10-06 for the open-loop campaign (the closed-loop campaign of
# 2026-08 ran H1 at 70%; see thesis_blueprint/08-open-loop-study.md §8.13).
# minReplicas: 1, maxReplicas: 5
#
# Purpose: How HPA performs "out of the box" for CPU-bound service (bcrypt)
# Expected: Should trigger for auth-service since bcrypt is CPU-intensive
#
# Usage:
#   kubectl apply -f b1-underprovisioned.yaml -n ecommerce   # Reset to 1 replica first
#   kubectl apply -f h1-hpa-default.yaml -n ecommerce
# Cleanup:
#   kubectl delete hpa auth-service-hpa-default -n ecommerce
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa-default
  namespace: ecommerce
  labels:
    experiment: h1-hpa-default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  # No behavior field — uses Kubernetes defaults
