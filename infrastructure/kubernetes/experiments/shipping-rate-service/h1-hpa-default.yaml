# H1: HPA Default — shipping-rate-service
# targetCPU: 80% = the Kubernetes default target (used when an HPA sets no metric),
# no behavior field (uses K8s defaults) -> H1 is HPA with Kubernetes defaults throughout.
# Changed from 70% on 2026-10-06 for the open-loop campaign (the closed-loop campaign of
# 2026-08 ran H1 at 70%; see thesis_blueprint/08-open-loop-study.md §8.13).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping-rate-service-hpa-default
  namespace: ecommerce
  labels:
    experiment: h1-hpa-default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping-rate-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
